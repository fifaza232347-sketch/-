<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>BitCar Bluetooth Controller</title>
  <style>
    body {
      font-family: sans-serif;
      background: #111827;
      color: #f9fafb;
      text-align: center;
      margin: 0;
      padding: 20px;
      touch-action: manipulation;
    }
    button.ctrl {
      width: 92px;
      height: 76px;
      margin: 6px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: #fff;
    }
    button.ctrl:active { background: #1d4ed8; }
    button.stop { background: #dc2626; }
    button.connect {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: #16a34a;
      color: #fff;
      margin-bottom: 16px;
    }
    .row { display: flex; justify-content: center; align-items: center; }
    #status { margin-bottom: 12px; color: #93c5fd; }
  </style>
</head>
<body>
  <h2>BitCar Mobile Controller</h2>
  <div id="status">สถานะ: ยังไม่เชื่อมต่อ</div>
  <button class="connect" onclick="connectBLE()">เชื่อมต่อ micro:bit (BLE)</button>

  <div class="row">
    <button class="ctrl"
      onpointerdown="sendCmd('F')"
      onpointerup="sendCmd('S')"
      onpointerleave="sendCmd('S')">เดินหน้า<br>(F)</button>
  </div>
  <div class="row">
    <button class="ctrl"
      onpointerdown="sendCmd('L')"
      onpointerup="sendCmd('S')"
      onpointerleave="sendCmd('S')">ซ้าย<br>(L)</button>
    <button class="ctrl stop" onclick="sendCmd('S')">หยุด<br>(S)</button>
    <button class="ctrl"
      onpointerdown="sendCmd('R')"
      onpointerup="sendCmd('S')"
      onpointerleave="sendCmd('S')">ขวา<br>(R)</button>
  </div>
  <div class="row">
    <button class="ctrl"
      onpointerdown="sendCmd('B')"
      onpointerup="sendCmd('S')"
      onpointerleave="sendCmd('S')">ถอยหลัง<br>(B)</button>
  </div>

  <script>
    const UART_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const UART_RX_CHAR = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    let rxChar = null;

    async function connectBLE() {
      try {
        document.getElementById("status").innerText = "กำลังค้นหา BBC micro:bit...";
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: "BBC micro:bit" }],
          optionalServices: [UART_SERVICE]
        });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(UART_SERVICE);
        rxChar = await service.getCharacteristic(UART_RX_CHAR);
        document.getElementById("status").innerText = "เชื่อมต่อแล้ว: " + (device.name || "micro:bit");
      } catch (err) {
        document.getElementById("status").innerText = "เชื่อมต่อไม่สำเร็จ: " + err.message;
      }
    }

    async function sendCmd(cmd) {
      if (!rxChar) return;
      const encoder = new TextEncoder();
      await rxChar.writeValue(encoder.encode(cmd + "\n"));
    }
  </script>
</body>
</html>
