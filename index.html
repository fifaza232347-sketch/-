<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>BitCar Bluetooth Controller</title>
  <style>
    body {
      font-family: sans-serif;
      background: #111827;
      color: #f9fafb;
      text-align: center;
      margin: 0;
      padding: 16px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #device-badge {
      display: inline-block;
      margin: 6px auto 10px auto;
      padding: 10px 20px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 14px;
      background: #374151;
      color: #d1d5db;
      border: 2px solid #4b5563;
    }
    #device-badge.connected {
      background: #064e3b;
      color: #6ee7b7;
      border-color: #10b981;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.35);
    }
    .btn-group {
      margin-bottom: 12px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    button.connect {
      padding: 10px 18px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: #16a34a;
      color: #fff;
      cursor: pointer;
    }
    button.disconnect {
      padding: 10px 14px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: #4b5563;
      color: #fff;
      cursor: pointer;
      display: none;
    }
    .speed-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 10px auto 14px auto;
    }
    button.spd-btn {
      padding: 10px 16px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: #d97706;
      color: #fff;
      cursor: pointer;
    }
    button.spd-btn:active {
      background: #b45309;
      transform: scale(0.96);
    }
    #speed-label {
      min-width: 110px;
      font-size: 16px;
      font-weight: bold;
      color: #fcd34d;
    }
    .pad {
      display: grid;
      grid-template-columns: repeat(3, 92px);
      gap: 10px;
      justify-content: center;
      margin-top: 8px;
    }
    button.ctrl {
      width: 92px;
      height: 78px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 14px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
      touch-action: none;
    }
    button.ctrl.diag {
      background: #1d4ed8;
      font-size: 15px;
    }
    button.ctrl.pressed {
      background: #3b82f6;
      transform: scale(0.95);
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.7);
    }
    button.stop {
      width: 92px;
      height: 78px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 14px;
      background: #dc2626;
      color: #fff;
      cursor: pointer;
    }
    #status {
      margin-bottom: 10px;
      font-size: 14px;
      color: #93c5fd;
    }
  </style>
</head>
<body>
  <h2>BitCar Controller</h2>

  <div>
    <div id="device-badge">ยังไม่ได้เชื่อมต่อบอร์ด</div>
  </div>

  <div id="status">กดปุ่มสีเขียวด้านล่างเพื่อเลือกคันที่ต้องการบังคับ</div>

  <div class="btn-group">
    <button id="btn-connect" class="connect" onclick="connectBLE()">เชื่อมต่อ micro:bit (BLE)</button>
    <button id="btn-disconnect" class="disconnect" onclick="disconnectBLE()">ตัดการเชื่อมต่อ</button>
  </div>

  <!-- แถบปุ่มเพิ่ม/ลดความเร็ว -->
  <div class="speed-bar">
    <button class="spd-btn" onclick="changeSpeed(-1)">- ลดความเร็ว</button>
    <div id="speed-label">ความเร็ว: ~78%</div>
    <button class="spd-btn" onclick="changeSpeed(1)">+ เพิ่มความเร็ว</button>
  </div>

  <!-- แผงควบคุม 9 ช่อง -->
  <div class="pad">
    <button class="ctrl diag" data-key="FL">↖<br>หน้า-ซ้าย</button>
    <button class="ctrl" data-key="F">▲<br>เดินหน้า</button>
    <button class="ctrl diag" data-key="FR">↗<br>หน้า-ขวา</button>

    <button class="ctrl" data-key="L">◀<br>หมุนซ้าย</button>
    <button class="stop" onclick="forceStop()">■<br>หยุด</button>
    <button class="ctrl" data-key="R">▶<br>หมุนขวา</button>

    <div></div>
    <button class="ctrl" data-key="B">▼<br>ถอยหลัง</button>
    <div></div>
  </div>

  <script>
    const UART_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const UART_RX_CHAR = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    let bleDevice = null;
    let writeChar = null;
    let isSending = false;
    let pendingCmd = null;
    let lastSentCmd = "";
    let currentSpeed = 200; // 80 - 255

    const activeKeys = new Set();

    const badgeEl = document.getElementById("device-badge");
    const statusEl = document.getElementById("status");
    const btnConnect = document.getElementById("btn-connect");
    const btnDisconnect = document.getElementById("btn-disconnect");
    const speedLabel = document.getElementById("speed-label");

    function updateSpeedLabel() {
      const pct = Math.round((currentSpeed / 255) * 100);
      speedLabel.innerText = "ความเร็ว: " + pct + "%";
    }

    function changeSpeed(delta) {
      if (delta > 0) {
        currentSpeed = Math.min(255, currentSpeed + 35);
        updateSpeedLabel();
        sendCmd("V+");
      } else {
        currentSpeed = Math.max(80, currentSpeed - 35);
        updateSpeedLabel();
        sendCmd("V-");
      }
    }

    function updateUIState(connected, deviceName = "") {
      if (connected) {
        badgeEl.innerText = "🟢 " + (deviceName || "BBC micro:bit");
        badgeEl.classList.add("connected");
        btnConnect.innerText = "เปลี่ยนบอร์ด";
        btnDisconnect.style.display = "inline-block";
      } else {
        badgeEl.innerText = "ยังไม่ได้เชื่อมต่อบอร์ด";
        badgeEl.classList.remove("connected");
        btnConnect.innerText = "เชื่อมต่อ micro:bit (BLE)";
        btnDisconnect.style.display = "none";
      }
    }

    async function connectBLE() {
      try {
        statusEl.innerText = "กำลังค้นหา BBC micro:bit...";
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: "BBC micro:bit" }],
          optionalServices: [UART_SERVICE]
        });

        if (bleDevice && bleDevice.gatt.connected) {
          bleDevice.gatt.disconnect();
        }

        bleDevice = device;
        bleDevice.addEventListener("gattserverdisconnected", () => {
          writeChar = null;
          activeKeys.clear();
          isSending = false;
          pendingCmd = null;
          lastSentCmd = "";
          updateUIState(false);
          statusEl.innerText = "ตัดการเชื่อมต่อแล้ว";
        });

        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(UART_SERVICE);
        const chars = await service.getCharacteristics();

        writeChar = chars.find(c => c.uuid === UART_RX_CHAR)
          || chars.find(c => c.properties.write || c.properties.writeWithoutResponse);

        if (!writeChar) {
          throw new Error("ไม่พบ Characteristic สำหรับส่งข้อมูล");
        }

        updateUIState(true, bleDevice.name);
        statusEl.innerText = "พร้อมบังคับ! ปรับความเร็วได้ด้วยปุ่ม + และ -";
      } catch (err) {
        statusEl.innerText = "เชื่อมต่อไม่สำเร็จ: " + err.message;
      }
    }

    function disconnectBLE() {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      }
    }

    function evaluateCommand() {
      if (activeKeys.size === 0) return "S";
      if (activeKeys.has("FL")) return "FL";
      if (activeKeys.has("FR")) return "FR";

      if (activeKeys.has("F") && activeKeys.has("L")) return "FL";
      if (activeKeys.has("F") && activeKeys.has("R")) return "FR";

      if (activeKeys.has("F")) return "F";
      if (activeKeys.has("B")) return "B";
      if (activeKeys.has("L")) return "L";
      if (activeKeys.has("R")) return "R";
      return "S";
    }

    function updateMovement() {
      const cmd = evaluateCommand();
      if (cmd !== lastSentCmd) {
        lastSentCmd = cmd;
        sendCmd(cmd);
      }
    }

    function forceStop() {
      activeKeys.clear();
      document.querySelectorAll("button.ctrl").forEach(b => b.classList.remove("pressed"));
      lastSentCmd = "S";
      sendCmd("S");
    }

    async function sendCmd(cmd) {
      if (!writeChar) {
        statusEl.innerText = "กรุณากดเชื่อมต่อ micro:bit ก่อน";
        return;
      }
      if (cmd !== "S" && isSending) {
        pendingCmd = cmd;
        return;
      }
      isSending = true;
      const data = new TextEncoder().encode(cmd + "\n");
      try {
        if (writeChar.properties.writeWithoutResponse) {
          await writeChar.writeValueWithoutResponse(data);
        } else if (writeChar.properties.write) {
          await writeChar.writeValue(data);
        }
        statusEl.innerText = "คำสั่งปัจจุบัน: " + cmd;
      } catch (err) {
        statusEl.innerText = "ส่งคำสั่งไม่สำเร็จ: " + err.message;
      } finally {
        isSending = false;
        if (pendingCmd) {
          const next = pendingCmd;
          pendingCmd = null;
          sendCmd(next);
        }
      }
    }

    document.querySelectorAll("button.ctrl[data-key]").forEach(btn => {
      const key = btn.getAttribute("data-key");

      btn.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        activeKeys.add(key);
        btn.classList.add("pressed");
        try { btn.setPointerCapture(e.pointerId); } catch (_) {}
        updateMovement();
      });

      const release = (e) => {
        if (!activeKeys.has(key)) return;
        e.preventDefault();
        activeKeys.delete(key);
        btn.classList.remove("pressed");
        try {
          if (btn.hasPointerCapture && btn.hasPointerCapture(e.pointerId)) {
            btn.releasePointerCapture(e.pointerId);
          }
        } catch (_) {}
        updateMovement();
      };

      btn.addEventListener("pointerup", release);
      btn.addEventListener("pointercancel", release);
    });
  </script>
</body>
</html>
